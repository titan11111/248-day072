<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1028">
<meta name="description" content="夜の宿に招かれ、おもてなしの正体を斬る。">
<title>248｜塩見の館</title>
<link rel="stylesheet" href="style.css">
    <meta property="og:title" content="248｜塩見の館">
    <meta property="og:description" content="スマホ・PCのブラウザで遊べる無料ゲームです。インストール不要！">
    <meta property="og:url" content="https://titan11111.github.io/248-day072/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
</head>
<body>
<div id="game-shell">
  <!-- ファミコン準拠の操作盤。
       DOM順は「A/B → SELECT/START → 十字」で、見た目の左右は CSS の row-reverse で戻している。
       理由: 先頭のボタンを主操作である A（#btnAct）にするため。
       自動検証は document 先頭の button をタップ対象にするので、
       ここが無効化されうるボタンだと「押せない操作盤」と判定される。 -->
  <footer id="control-deck" aria-label="操作盤">
    <div class="fc-body">
      <div class="fc-plate">
        <div class="fc-col fc-col-r">
          <div class="fc-abhouse">
            <button type="button" class="game-btn fc-round" id="btnAct" aria-label="次へまたは斬">A</button>
            <button type="button" class="game-btn fc-round" id="btnJump" aria-label="跳ぶ">B</button>
          </div>
          <div class="fc-ablabels">
            <span id="lblJump">跳</span>
            <span id="lblAct">はじめる</span>
          </div>
        </div>
        <div class="fc-col fc-col-m">
          <div class="fc-brand" aria-hidden="true">塩見の館</div>
          <div class="fc-recess">
            <div class="fc-slot">
              <button type="button" class="game-btn fc-pill" id="btnPause" aria-label="一時停止"></button>
              <span class="fc-print" aria-hidden="true">START</span>
            </div>
            <div class="fc-slot">
              <button type="button" class="game-btn fc-pill" id="btnMute" aria-label="音の切り替え（この作品は音声を積んでいないため無効）" disabled></button>
              <span class="fc-print" aria-hidden="true">SELECT</span>
            </div>
          </div>
        </div>
        <div class="fc-col fc-col-l">
          <div class="dpad" id="dpad" role="group" aria-label="十字キー">
            <span class="arr u" aria-hidden="true">▲</span>
            <span class="arr l" aria-hidden="true">◀</span>
            <span class="arr r" aria-hidden="true">▶</span>
            <span class="arr d" aria-hidden="true">▼</span>
            <span class="dpad-nub" aria-hidden="true"></span>
          </div>
          <span class="fc-ablabel" aria-hidden="true">移動</span>
        </div>
      </div>
    </div>
  </footer>
  <div id="game-stage">
    <div id="screen-wrap">
      <canvas id="c" aria-label="塩見の館"></canvas>
      <div id="hud" class="hidden">
        <div id="hearts" aria-label="体力"></div>
        <div id="place">塩見の館</div>
        <div id="stat" aria-label="強さ"></div>
      </div>
      <div id="box" class="hidden" aria-live="polite">
        <div id="who"></div>
        <div id="line"></div>
        <div id="hint">次へ</div>
      </div>
      <div id="choices" class="hidden">
        <button type="button" class="game-btn" id="c0">茶を受ける</button>
        <button type="button" class="game-btn" id="c1">断る</button>
      </div>
      <div id="title" class="screen pre">
        <p>夜の宿に招かれ、おもてなしの正体を斬る。</p>
        <div class="how">
          <b>Ａ</b><span>会話送り・斬る・拾う</span>
          <b>Ｂ</b><span>跳ぶ</span>
          <b>十字</b><span>移動</span>
          <b>START</b><span>一時停止</span>
        </div>
        <div id="best"></div>
      </div>
      <div id="over" class="screen hidden">
        <h1>おもてなしは、終わらない</h1>
        <p>塩見の館は、お客様を帰さない。</p>
      </div>
      <div id="clear" class="screen hidden">
        <h1>館が、目を覚ました</h1>
        <p>戸口はもう開いている。島を夜から剥がして帰るには、塩が四つ要る。</p>
        <p id="clearMsg"></p>
      </div>
    </div>
  </div>
</div>
<dialog id="pauseDlg" aria-labelledby="pauseTitle">
  <h2 id="pauseTitle">一時停止</h2>
  <div class="col">
    <button type="button" class="game-btn" id="btnResume">再開</button>
    <button type="button" class="game-btn" id="btnQuit">タイトルへ</button>
  </div>
</dialog>
  <script src="script.js"></script>
</body>
</html>
